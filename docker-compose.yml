name: course7-tp26
services:
  mysql:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: bookdb
      MYSQL_USER: ${DB_USER:-bookuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bookpass-lab-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass-lab-only}
      MYSQL_INITDB_SKIP_TZINFO: '1'
    ports:
    - 127.0.0.1:13326:3306
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysql --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT
        1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 768m
    command:
    - --performance-schema=OFF
    - --innodb-buffer-pool-size=64M
    - --max-connections=80
  pricing-service:
    build: ./pricing-service
    image: course7-tp26-pricing:1.0.0
    ports:
    - 127.0.0.1:18326:8082
    environment:
      PRICING_FAILURE_PERCENT: ${PRICING_FAILURE_PERCENT:-30}
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8082/actuator/health/readiness
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 256m
  book-service-1:
    build: ./book-service
    image: course7-tp26-book:1.0.0
    ports:
    - 127.0.0.1:18026:8081
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER:-bookuser}
      DB_PASSWORD: ${DB_PASSWORD:-bookpass-lab-only}
    depends_on:
      mysql:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8081/actuator/health/readiness
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 512m
  book-service-2:
    build: ./book-service
    image: course7-tp26-book:1.0.0
    ports:
    - 127.0.0.1:18126:8081
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER:-bookuser}
      DB_PASSWORD: ${DB_PASSWORD:-bookpass-lab-only}
    depends_on:
      mysql:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      book-service-1:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8081/actuator/health/readiness
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 512m
  book-service-3:
    build: ./book-service
    image: course7-tp26-book:1.0.0
    ports:
    - 127.0.0.1:18226:8081
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER:-bookuser}
      DB_PASSWORD: ${DB_PASSWORD:-bookpass-lab-only}
    depends_on:
      mysql:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      book-service-1:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8081/actuator/health/readiness
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 512m
volumes:
  mysql_data: null
