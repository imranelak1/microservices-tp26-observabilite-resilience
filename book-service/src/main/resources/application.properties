server.port=8081
 spring.profiles.default=dev
 spring.jpa.hibernate.ddl-auto=update
 spring.jpa.open-in-view=false
 pricing.base-url=${PRICING_BASE_URL:http://localhost:8082}
 management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retryevents
 management.endpoint.health.show-details=always
 management.endpoint.health.probes.enabled=true
 resilience4j.retry.instances.pricing.max-attempts=3
 resilience4j.retry.instances.pricing.wait-duration=100ms
 resilience4j.circuitbreaker.instances.pricing.sliding-window-type=COUNT_BASED
 resilience4j.circuitbreaker.instances.pricing.sliding-window-size=10
 resilience4j.circuitbreaker.instances.pricing.minimum-number-of-calls=5
 resilience4j.circuitbreaker.instances.pricing.failure-rate-threshold=50
 resilience4j.circuitbreaker.instances.pricing.wait-duration-in-open-state=10s
 resilience4j.circuitbreaker.instances.pricing.permitted-number-of-calls-in-half-open-state=2
